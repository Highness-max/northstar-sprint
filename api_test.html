<!DOCTYPE html>
<html>
<head>
    <title>API Learning - Mini Prototype</title>
</head>
<body>
    <h1>📡 API Test (Assignment 1)</h1>
    <button onclick="fetchData()">Fetch Post from API</button>
    <div id="output" style="border:1px solid #ccc; padding:15px; margin-top:10px;">
        Click the button to load data.
    </div>

    <script>
        // ASSIGNMENT 1: Learning APIs - Mini Prototype
        async function fetchData() {
            const output = document.getElementById('output');
            output.innerHTML = '⏳ Loading...';

            try {
                // This is a free public API (JSONPlaceholder)
                const response = await fetch('https://jsonplaceholder.typicode.com/postsss/1');
                
                // Check if the API worked
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                
                // Display the data on the page
                output.innerHTML = `
                    <strong>✅ API Call Successful!</strong><br><br>
                    <strong>Title:</strong> ${data.title}<br>
                    <strong>Body:</strong> ${data.body}<br><br>
                    <small style="color:gray;">(This data came from a live server, not a hardcoded object!)</small>
                `;
            } catch (error) {
                output.innerHTML = `❌ Error: ${error.message}. Check your internet connection.`;
            }
        }
    </script>
</body>
</html>
