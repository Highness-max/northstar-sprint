<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Support</title>
    <!-- Font Awesome Icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* T-02: CSS Design System */
        :root {
            --primary: #1a2b4c;
            --gold: #d4af37;
            --light-bg: #f8f9fc;
            --card-shadow: 0 8px 20px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light-bg);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 900px; width: 100%; }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        .header h1 i { color: var(--gold); margin-right: 10px; }
        .header p { color: #555; font-size: 1.1rem; }

        /* Grid for 2 cards */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* Cards */
        .card {
            background: white;
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            border-top: 5px solid var(--primary);
        }
        .card h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .card h2 i { color: var(--gold); margin-right: 10px; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.2s;
            min-width: 150px;
        }
        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .input-group button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover { background: #2a4b7c; transform: scale(1.02); }
        .input-group button:active { transform: scale(0.98); }

        .result-box {
            background: #f0f2f5;
            padding: 15px;
            border-radius: 8px;
            min-height: 70px;
            border-left: 4px solid var(--gold);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        /* Status Badges (T-10) */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .badge-processing { background: #fff3cd; color: #856404; }
        .badge-shipped { background: #cce5ff; color: #004085; }
        .badge-delivered { background: #d4edda; color: #155724; }
        .badge-refund { background: #d1ecf1; color: #0c5460; }

        /* Responsive (T-03) */
        @media (max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
        .fallback-btn {
            background: #e9ecef;
            color: var(--primary);
            border: 1px solid #ccc;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .fallback-btn:hover { background: #dee2e6; }
    </style>
</head>
<body>
<div class="container">
    <!-- Header (T-03) -->
    <div class="header">
        <h1><i class="fas fa-store"></i> Northstar Retail</h1>
        <p><i class="fas fa-robot" style="color:var(--gold);"></i> Self-Service Support — No ticket needed for these 2 categories</p>
        <hr style="width:80px; margin:10px auto; border:2px solid var(--gold);">
    </div>

    <!-- Grid of 2 Cards (T-04 & T-05) -->
    <div class="grid">
        <!-- Card 1: Order Status -->
        <div class="card">
            <h2><i class="fas fa-box"></i> Order Status</h2>
            <div class="input-group">
                <input type="text" id="orderInput" placeholder="e.g. #1001">
                <button onclick="checkOrder()"><i class="fas fa-search"></i> Check</button>
            </div>
            <div id="orderResult" class="result-box">
                <i class="fas fa-info-circle"></i> Awaiting order number...
            </div>
        </div>

        <!-- Card 2: Returns / Refunds -->
        <div class="card">
            <h2><i class="fas fa-undo-alt"></i> Refund Status</h2>
            <div class="input-group">
                <input type="text" id="refundInput" placeholder="e.g. #1001">
                <button onclick="checkRefund()"><i class="fas fa-coins"></i> Check</button>
            </div>
            <div id="refundResult" class="result-box">
                <i class="fas fa-info-circle"></i> Awaiting order number...
            </div>
        </div>
    </div>
</div>

<script>
    // T-06: Mock Database (6 orders)
    const orderDatabase = {
        "#1001": { status: "Delivered", delivery: "Aug 10, 2026", refund: null },
        "#1002": { status: "Shipped", delivery: "Aug 18, 2026", refund: null },
        "#1003": { status: "Processing", delivery: "Aug 22, 2026", refund: "Approved: $79.99 (2-3 days)" },
        "#1004": { status: "Delivered", delivery: "Aug 5, 2026", refund: "Pending review" },
        "#1005": { status: "Shipped", delivery: "Aug 16, 2026", refund: null },
        "#1006": { status: "Processing", delivery: "Aug 25, 2026", refund: "Approved: $45.00 (1-2 days)" }
    };

    // Helper to get badge HTML
    function getBadge(status) {
        const map = {
            "Processing": '<span class="badge badge-processing">⏳ Processing</span>',
            "Shipped": '<span class="badge badge-shipped">🚚 Shipped</span>',
            "Delivered": '<span class="badge badge-delivered">✅ Delivered</span>'
        };
        return map[status] || status;
    }

    // T-07 & T-09: Order Status Logic
    function checkOrder() {
        const input = document.getElementById('orderInput');
        const result = document.getElementById('orderResult');
        const val = input.value.trim();

        // Error Handling
        if (val === "") {
            result.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#d4af37;"></i> Please enter an Order ID (e.g., #1001)';
            return;
        }
        // Auto-fix missing '#'
        const formatted = val.startsWith('#') ? val : `#${val}`;
        
        const order = orderDatabase[formatted];
        if (!order) {
            result.innerHTML = `
                <i class="fas fa-frown" style="color:#d4af37;"></i> We couldn't find "${formatted}".
                <br><button class="fallback-btn" onclick="alert('Support ticket opened for ${formatted}')">
                <i class="fas fa-ticket-alt"></i> Open a support ticket (auto-filled)</button>
            `;
            return;
        }

        // Success
        result.innerHTML = `
            <strong>${formatted}</strong> — ${getBadge(order.status)}<br>
            <i class="fas fa-calendar-alt"></i> Expected delivery: ${order.delivery}
        `;
    }

    // T-08 & T-09: Refund Logic
    function checkRefund() {
        const input = document.getElementById('refundInput');
        const result = document.getElementById('refundResult');
        const val = input.value.trim();

        if (val === "") {
            result.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#d4af37;"></i> Please enter an Order ID (e.g., #1001)';
            return;
        }
        const formatted = val.startsWith('#') ? val : `#${val}`;
        
        const order = orderDatabase[formatted];
        if (!order) {
            result.innerHTML = `
                <i class="fas fa-frown" style="color:#d4af37;"></i> No order found for "${formatted}".
                <br><button class="fallback-btn" onclick="alert('Refund ticket opened for ${formatted}')">Open a refund ticket</button>
            `;
            return;
        }

        if (!order.refund) {
            result.innerHTML = `<i class="fas fa-check-circle" style="color:green;"></i> No refund requested for ${formatted}.`;
        } else {
            result.innerHTML = `
                <i class="fas fa-coins" style="color:var(--gold);"></i> <strong>Refund Status:</strong> ${order.refund}
                <br><span class="badge badge-refund">💰 Active</span>
            `;
        }
    }
</script>
</body>
</html>
